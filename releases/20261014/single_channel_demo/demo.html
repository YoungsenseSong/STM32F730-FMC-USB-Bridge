<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>无线传感采集演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f7;color:#172b30;font-family:system-ui,"Microsoft Yahei",sans-serif;letter-spacing:0}
main{max-width:1120px;margin:32px auto;padding:0 32px}.eyebrow{color:#527577;letter-spacing:0;font-size:12px}h1{font-size:26px;margin:12px 0}
.sub{color:#5e737b;font-size:14px}.chain{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:28px 0;font-size:14px}.node{padding:8px 0;font-weight:600}.arrow{color:#6c878d;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;border-top:1px solid #d2dddf;border-bottom:1px solid #d2dddf;padding:22px 0}.card{padding:0}.label{color:#5e737b;font-size:13px}.value{font-size:29px;margin-top:8px;font-variant-numeric:tabular-nums}.plot{margin-top:28px}.plothead{display:flex;justify-content:space-between;align-items:center;gap:12px}canvas{display:block;width:100%;height:280px;margin-top:20px;background:white;border:1px solid #d7e0e2;border-radius:4px}#status{color:#087750;font-size:13px}footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;color:#5e737b;font-size:13px;flex-wrap:wrap}button{background:white;color:#294d52;border:1px solid #9fb4b7;border-radius:4px;padding:10px 16px;cursor:pointer}.ok{color:#087750}.bad{color:#b14530}.detail{margin-top:12px;font-size:13px;color:#5e737b;line-height:1.8}
@media(max-width:700px){main{padding:0 20px;margin:24px auto}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}.plothead{align-items:flex-start;flex-direction:column}canvas{height:240px}.value{font-size:25px}}
</style><main><div class="eyebrow">MULTISENSOR RESEARCH · LIVE DEMO</div><h1>无线传感采集</h1><div class="sub">实物 MEMS · USB FS CDC / COM6</div>
<div class="chain"><div class="node">IIM / nRF TX</div><span class="arrow">→ 无线 →</span><div class="node">nRF RX</div><span class="arrow">→ SPI →</span><div class="node">FPGA</div><span class="arrow">→ 三线串行 →</span><div class="node">F730</div><span class="arrow">→ USB →</span><div class="node">电脑</div></div>
<div class="cards"><div class="card"><div class="label">已接收记录</div><div class="value" id="records">0</div></div><div class="card"><div class="label">已接收数据块</div><div class="value" id="blocks">0</div></div><div class="card"><div class="label">当前有效数据速率</div><div class="value" id="rate">0 KB/s</div></div><div class="card"><div class="label">累计数据量</div><div class="value" id="bytes">0 KB</div></div></div>
<div class="plot"><div class="plothead"><div><strong>原始采样波形</strong><div class="detail" id="sensor">MEMS · 等待采样</div></div><span id="status">等待连接</span></div><canvas id="wave" width="1000" height="260"></canvas><div class="detail" id="quality">尚未收到数据，校验待确认</div></div>
<footer><span id="elapsed">运行 0 秒</span><span id="saved">等待数据</span><button onclick="fetch('/stop',{method:'POST'})">停止接收并保存</button></footer></main>
<script>
const $=id=>document.getElementById(id),ctx=$('wave').getContext('2d');
function draw(a){ctx.clearRect(0,0,1000,260);ctx.strokeStyle='#e1e9eb';ctx.lineWidth=1;for(let y=20;y<260;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}if(a.length<2)return;const low=Math.min(...a),high=Math.max(...a),span=Math.max(high-low,20),mid=(high+low)/2;ctx.strokeStyle='#078d85';ctx.lineWidth=1.5;ctx.beginPath();a.forEach((v,i)=>{const x=i*1000/(a.length-1),y=130-(v-mid)*220/span;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#527277';ctx.font='12px sans-serif';ctx.fillText(`原始值范围 ${low} ～ ${high}`,12,15)}
async function refresh(){try{const s=await(await fetch('/state')).json();$('records').textContent=s.records.toLocaleString();$('blocks').textContent=s.blocks.toLocaleString();$('rate').textContent=(s.rate/1024).toFixed(1)+' KB/s';$('bytes').textContent=(s.bytes/1024).toFixed(1)+' KB';$('status').textContent=s.status;$('elapsed').textContent='运行 '+s.elapsed.toFixed(1)+' 秒 · 最近块 '+(s.last_block??'—');$('saved').textContent=s.blocks?'接收数据已保存':'等待真实数据';const bad=s.crc_errors||s.usb_gaps||s.discarded;$('quality').className='detail '+(bad?'bad':s.blocks?'ok':'');$('quality').textContent=s.blocks?`CRC 错误 ${s.crc_errors} · USB 序号异常 ${s.usb_gaps} · 传输记录缺口 ${s.transport_gaps} · 射频序号缺口 ${s.radio_gaps}`:'尚未收到数据，校验待确认';$('sensor').textContent=s.sensor_timestamp_ms===null?'MEMS · 等待采样':`MEMS · 采集时间 ${(s.sensor_timestamp_ms/1000).toFixed(3)} s · 射频帧 ${s.rf_sequence}`;draw(s.samples)}catch(e){$('status').textContent='接收服务未连接'}setTimeout(refresh,250)}refresh();
</script></html>
